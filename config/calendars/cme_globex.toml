# The exchange's Globex calendar (DESIGN 5.3). Frozen once created (DESIGN 4.3, I-10).
# All times are exchange-local wall-clock times in `tz`. The week runs from
# week_open to week_close with a daily break; a closure shuts the market for a
# local interval [start, end) and its `end` is the instant trading resumes.
# The weekly schedule, the daily break and the day roll come from the exchange's
# public trading hours; their companions are the top-level checked, source and
# verified. Each closure carries its own. None is verified: every date and time
# below is NOT PROVEN until read from the exchange's own file.
# Holiday hours differ by minutes between product groups; this one calendar
# uses the equity index hours for all instruments that name it.
name = "cme_globex"
tz = "America/New_York"
week_open = ["Sun", "18:00"]
week_close = ["Fri", "17:00"]
daily_break = ["17:00", "18:00"]
day_rolls_at = "17:00"       # a bar belongs to the trading day that ends at the next 17:00 local
checked = "2026-10-12"
source = "the exchange's public Globex trading hours, https://www.cmegroup.com/trading-hours.html (Sunday 18:00 to Friday 17:00 New York time, daily break 17:00 to 18:00); recalled, not read on the checked date"
verified = false

