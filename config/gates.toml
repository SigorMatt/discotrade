# The owner's two manual conditions of the gate for stage 3 (SPEC §14; DESIGN 3,
# 15.5; decision 2026-10-17-m19 153 (b)). Only the owner sets either to true, by
# a logged decision. The dashboard's gates panel shows them; no other code reads
# them, and neither moves a result.

[stage3]
stage2_fills_match = false   # "Stage 2 fills match the cost model within a set tolerance."
tax_confirmed = false        # "Tax treatment is confirmed with an accountant."
