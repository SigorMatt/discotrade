# The rejection suite (DESIGN 12.5; decision 104 (a) of 2026-10-14-m13 as the
# owner's O-22 of 2026-10-15 narrows it; read by tests/test_rejected_suite.py).
#
# One validation fixture per entry of DESIGN 12.5's list and REVIEW-12's two:
# `file` (relative to the repository's root), the `entry` it covers, the `stage`
# of DESIGN 12.2 that rejects it (decision 98 (d)) and, for the static stage, the
# `rule` of DESIGN 12.1 (validation.static.RULES). A run-time entry reuses a text
# of tests/fixtures/strategies/ where one exists. The child-process backend leaves
# this directory out of the sources it accepts (decision 104 (d)).

[[entry]]
file = "tests/fixtures/rejected/network_access.py"
