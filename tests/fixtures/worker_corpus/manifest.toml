# decisions 138 and 122 (b) of meta/decisions/; HF-009). Checked by
# tests/test_worker_corpus.py; what a replay makes of it is proven by the M3 gate.
#
# [[strategy]]: each new strategy file under strategies/, the family and the
# horizon of the track test_synth it is written for.
# [[response]]: every response file (file: relative to this directory); its model; the
# strategy file (relative to the repository root) its one fenced
# Python block equals byte for byte ("none": no block); parse, what
# workers.parse.parse gives ("ok", "no_block" or "no_description"); description,
# the line after the block as written ("" when there is none); outcome, served and
# attempt, the call row it gave in the measured replay below.
#
# Measured with throwaway replays outside the repository: `discotrade replay
# --sandbox process --provider scripted:<dir> --coordinator scripted` on test_synth,
# tests/fixtures/config/ copied with thresholds_gate.toml as thresholds.toml, the
# state made by init-state at 2019-06-03T00:00:00+00:00.
# m3/: the twenty trading days 2019-07-15 to 2019-08-09.
# m3_pool/: the trading days 2019-07-15 to 2019-07-31; the budget row on 2019-07-15,
